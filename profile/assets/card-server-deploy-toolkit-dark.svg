<text x="32" y="340" font-size="17" fill="#B6C2D1">Deploy applications to your own Linux servers</text>
<text x="32" y="366" font-size="17" fill="#B6C2D1">with <tspan fill="#F7F8FA" font-weight="600">Ansible</tspan>. No platform lock-in, just your hosts.</text>


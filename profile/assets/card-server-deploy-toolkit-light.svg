<text x="444" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6E63">Ansible → Linux</text>
<text x="32" y="340" font-size="17" fill="#526173">Deploy applications to your own Linux servers</text>
<text x="32" y="366" font-size="17" fill="#526173">with <tspan fill="#111827" font-weight="600">Ansible</tspan>. No platform lock-in, just your hosts.</text>


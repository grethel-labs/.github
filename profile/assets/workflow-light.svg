<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d" fill="none">
<title id="t">How the lab works</title>
<desc id="d">Three steps: ideas start as open experiments, useful ones are hardened into tools, then shared as versioned open source.</desc>
<style>
